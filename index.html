<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#04040e"/>
<title>New Tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;-webkit-font-smoothing:antialiased}

:root{
  --bg:       #04040e;
  --surface:  rgba(255,255,255,0.04);
  --border:   rgba(0,220,255,0.13);
  --border-hi:rgba(0,220,255,0.35);
  --cyan:     #00dcff;
  --purple:   #a855f7;
  --text-hi:  #eaf4ff;
  --text-dim: rgba(200,220,232,0.38);
  --fui:      'Inter', sans-serif;
  --fhud:     'Orbitron', sans-serif;
}

body{
  background:var(--bg);
  font-family:var(--fui);
  color:var(--text-hi);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100dvh;
}

#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.5}
.vig{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(4,4,14,0.75) 100%);
}

#wrap{
  position:relative;z-index:10;
  display:flex;flex-direction:column;align-items:center;
  gap:clamp(28px,5vh,48px);
  padding:24px 20px;
  width:100%;
}

/* ── CLOCK ── */
#clk{
  font-family:var(--fhud);
  font-size:clamp(52px,15vw,120px);
  font-weight:700;letter-spacing:0.05em;
  color:var(--text-hi);line-height:1;text-align:center;
  text-shadow:0 0 30px rgba(0,220,255,0.3),0 0 70px rgba(0,220,255,0.1);
  animation:glow 4s ease-in-out infinite alternate;
  user-select:none;
}
@keyframes glow{
  from{text-shadow:0 0 24px rgba(0,220,255,0.25),0 0 55px rgba(0,220,255,0.08)}
  to  {text-shadow:0 0 40px rgba(0,220,255,0.5),0 0 95px rgba(0,220,255,0.16)}
}
#clk-date{
  font-family:var(--fhud);font-size:clamp(9px,1.6vw,11px);
  font-weight:500;letter-spacing:0.22em;color:var(--text-dim);
  text-align:center;text-transform:uppercase;
  margin-top:-clamp(16px,2.8vh,26px);user-select:none;
}

/* ── SEARCH ── */
#srch-wrap{
  width:100%;max-width:clamp(300px,72vw,540px);
  position:relative;
}
#srch{
  display:flex;align-items:center;
  height:clamp(46px,7vw,58px);border-radius:999px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  padding:0 8px 0 clamp(16px,2.8vw,22px);
  gap:8px;
  transition:border-color 0.2s,box-shadow 0.2s;
  position:relative;overflow:hidden;
}
#srch::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent);
  pointer-events:none;
}
#srch:focus-within{
  border-color:rgba(168,85,247,0.45);
  box-shadow:0 0 18px rgba(168,85,247,0.15);
}
.s-ico{color:var(--text-dim);flex-shrink:0;pointer-events:none}

#s-inp{
  flex:1;background:transparent;border:none;outline:none;
  font-family:var(--fui);font-size:clamp(13px,2.2vw,15px);
  font-weight:400;color:var(--text-hi);
  caret-color:var(--purple);min-width:0;
  -webkit-appearance:none;appearance:none;
}
#s-inp::-webkit-search-decoration,
#s-inp::-webkit-search-cancel-button,
#s-inp::-webkit-search-results-button,
#s-inp::-webkit-search-results-decoration{display:none}
#s-inp::placeholder{color:var(--text-dim)}
#s-inp::selection{background:rgba(168,85,247,0.22)}

#s-btn{
  width:clamp(32px,5.5vw,40px);height:clamp(32px,5.5vw,40px);
  border-radius:50%;border:1px solid var(--border);
  background:rgba(0,220,255,0.06);
  color:var(--text-dim);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
  transition:all 0.2s ease;
  padding:0;
}
#s-btn:hover,#s-btn:active{
  background:rgba(0,220,255,0.14);
  border-color:var(--border-hi);
  color:var(--cyan);
  box-shadow:0 0 10px rgba(0,220,255,0.18);
}

/* Suggestions */
#suggest{
  position:absolute;top:calc(100% + 8px);left:0;right:0;
  background:rgba(5,5,18,0.97);
  border:1px solid var(--border-hi);border-radius:14px;
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  z-index:100;overflow:hidden;
  box-shadow:0 16px 48px rgba(0,0,0,0.55),0 0 14px rgba(0,220,255,0.1);
  display:none;
}
#suggest.open{display:block}
.sg-row{
  display:flex;align-items:center;gap:10px;
  padding:clamp(9px,1.5vw,12px) clamp(14px,2.5vw,20px);
  cursor:pointer;transition:background 0.14s;
}
.sg-row:hover,.sg-row:active{background:rgba(0,220,255,0.06)}
.sg-ico{color:var(--text-dim);font-size:11px;flex-shrink:0}
.sg-txt{
  font-size:clamp(12px,1.9vw,13px);color:var(--text-hi);
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sg-txt em{color:var(--cyan);font-style:normal}
.sg-sep{height:1px;background:rgba(0,220,255,0.07);margin:0 16px}

/* ── QUICK LINKS ── */
#links{
  display:flex;gap:clamp(18px,4vw,32px);
  align-items:center;justify-content:center;
}
.link{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  text-decoration:none;
  transition:transform 0.2s cubic-bezier(0.34,1.5,0.64,1);
}
.link:hover{transform:translateY(-5px)}
.link:active{transform:scale(0.94)}
.link-circle{
  width:clamp(52px,10vw,68px);height:clamp(52px,10vw,68px);
  border-radius:50%;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  display:flex;align-items:center;justify-content:center;
  transition:border-color 0.2s,box-shadow 0.2s,background 0.2s;
  position:relative;overflow:hidden;
}
.link-circle::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(135deg,rgba(255,255,255,0.06) 0%,transparent 60%);
  pointer-events:none;
}
.link-circle svg{
  width:clamp(22px,4.5vw,30px);height:clamp(22px,4.5vw,30px);
  transition:transform 0.2s;position:relative;z-index:1;
}
.link:hover .link-circle svg,.link:active .link-circle svg{transform:scale(1.1)}
.link-lbl{
  font-family:var(--fhud);font-size:clamp(8px,1.3vw,10px);
  font-weight:500;letter-spacing:0.14em;
  color:var(--text-dim);text-align:center;text-transform:uppercase;
  transition:color 0.2s;
}
.link:hover .link-lbl,.link:active .link-lbl{color:var(--text-hi)}
.link.gh:hover .link-circle,.link.gh:active .link-circle{border-color:rgba(255,255,255,0.3);box-shadow:0 0 18px rgba(255,255,255,0.1);background:rgba(255,255,255,0.07)}
.link.rd:hover .link-circle,.link.rd:active .link-circle{border-color:rgba(255,90,0,0.45);box-shadow:0 0 18px rgba(255,90,0,0.18);background:rgba(255,90,0,0.07)}
.link.yt:hover .link-circle,.link.yt:active .link-circle{border-color:rgba(255,0,0,0.45);box-shadow:0 0 18px rgba(255,0,0,0.18);background:rgba(255,0,0,0.07)}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="vig"></div>

<div id="wrap">

  <div>
    <div id="clk">00:00:00</div>
    <div id="clk-date">—</div>
  </div>

  <div id="srch-wrap">
    <form
      id="sf"
      action="https://www.google.com/search"
      method="GET"
    >
      <div id="srch">
        <svg class="s-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             width="17" height="17" style="color:rgba(200,220,232,0.38)">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>

        <input
          id="s-inp"
          name="q"
          type="search"
          inputmode="search"
          enterkeyhint="search"
          placeholder="Search Google or type a URL"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
        />

        <button id="s-btn" type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
               width="15" height="15">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </div>
    </form>
    <div id="suggest"></div>
  </div>

  <div id="links">

    <a class="link gh" href="https://github.com">
      <div class="link-circle">
        <svg viewBox="0 0 24 24" fill="currentColor" style="color:#fff">
          <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
        </svg>
      </div>
      <span class="link-lbl">GitHub</span>
    </a>

    <a class="link rd" href="https://reddit.com">
      <div class="link-circle">
        <svg viewBox="0 0 24 24" fill="currentColor" style="color:#ff5700">
          <path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701zM9.25 12C8.561 12 8 12.562 8 13.25c0 .687.561 1.248 1.25 1.248.687 0 1.248-.561 1.248-1.249 0-.688-.561-1.249-1.249-1.249zm5.5 0c-.687 0-1.248.561-1.248 1.25 0 .687.561 1.248 1.249 1.248.688 0 1.249-.561 1.249-1.249 0-.687-.562-1.249-1.25-1.249zm-5.466 3.99a.327.327 0 0 0-.231.094.33.33 0 0 0 0 .463c.842.842 2.484.913 2.961.913.477 0 2.105-.056 2.961-.913a.361.361 0 0 0 .029-.463.33.33 0 0 0-.464 0c-.547.533-1.684.73-2.512.73-.828 0-1.979-.196-2.512-.73a.326.326 0 0 0-.232-.095z"/>
        </svg>
      </div>
      <span class="link-lbl">Reddit</span>
    </a>

    <a class="link yt" href="https://youtube.com">
      <div class="link-circle">
        <svg viewBox="0 0 24 24" fill="currentColor" style="color:#ff0000">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
      </div>
      <span class="link-lbl">YouTube</span>
    </a>

  </div>
</div>

<script>
/* ── CANVAS ── */
const C=document.getElementById('bg-canvas'),X=C.getContext('2d');
let W,H;
function rsz(){W=C.width=window.innerWidth;H=C.height=window.innerHeight}
rsz();window.addEventListener('resize',rsz);
const N=Math.min(40,Math.floor(window.innerWidth/18));
const dots=Array.from({length:N},()=>({
  x:Math.random(),y:Math.random(),
  vx:(Math.random()-.5)*.00025,vy:(Math.random()-.5)*.00025,
  r:Math.random()*.7+.25,
  ph:Math.random()*Math.PI*2,ps:Math.random()*.004+.002
}));
(function frame(){
  X.clearRect(0,0,W,H);
  dots.forEach((d,i)=>{
    d.x+=d.vx;d.y+=d.vy;d.ph+=d.ps;
    if(d.x<0)d.x=1;if(d.x>1)d.x=0;
    if(d.y<0)d.y=1;if(d.y>1)d.y=0;
    const a=(Math.sin(d.ph)*.4+.5)*.45;
    X.beginPath();X.arc(d.x*W,d.y*H,d.r,0,6.28);
    X.fillStyle=`rgba(0,220,255,${a})`;X.fill();
    for(let j=i+1;j<dots.length;j++){
      const q=dots[j],dx=(d.x-q.x)*W,dy=(d.y-q.y)*H,dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<88){
        X.beginPath();X.moveTo(d.x*W,d.y*H);X.lineTo(q.x*W,q.y*H);
        X.strokeStyle=`rgba(0,220,255,${(1-dist/88)*.055})`;
        X.lineWidth=.5;X.stroke();
      }
    }
  });
  requestAnimationFrame(frame);
})();

/* ── CLOCK ── */
const DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function tick(){
  const n=new Date();
  document.getElementById('clk').textContent=
    [n.getHours(),n.getMinutes(),n.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');
  document.getElementById('clk-date').textContent=
    `${DAYS[n.getDay()]} · ${n.getDate()} ${MONTHS[n.getMonth()]} ${n.getFullYear()}`;
}
tick();setInterval(tick,1000);

/* ── SEARCH ── */
const form  = document.getElementById('sf');
const input = document.getElementById('s-inp');
const sug   = document.getElementById('suggest');

form.addEventListener('submit', function(e) {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  sug.classList.remove('open');
  // Detect if it looks like a direct URL
  const isURL = /^(https?:\/\/|www\.)|^[\w-]+\.[a-z]{2,}(\/|$)/i.test(q);
  const dest  = isURL
    ? (q.startsWith('http') ? q : 'https://' + q)
    : 'https://www.google.com/search?q=' + encodeURIComponent(q);
    
  // Navigate the current tab to the destination
  window.location.href = dest;
});

/* ── SUGGESTIONS ── */
const QUICK=[
  'youtube.com','github.com','reddit.com','google.com',
  'localhost:3000','stackoverflow.com','twitter.com',
  'linkedin.com','amazon.com','figma.com','discord.com'
];

input.addEventListener('input', () => {
  const q = input.value.trim().toLowerCase();
  if (!q) { sug.classList.remove('open'); return; }
  const hits = QUICK.filter(p => p.includes(q)).slice(0, 4);
  if (!hits.length) { sug.classList.remove('open'); return; }
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  sug.innerHTML = hits.map((p, i) => `
    <div class="sg-row" data-url="https://${p}">
      <span class="sg-ico">🌐</span>
      <span class="sg-txt">${p.replace(new RegExp(esc(q),'gi'), m => `<em>${m}</em>`)}</span>
    </div>${i < hits.length-1 ? '<div class="sg-sep"></div>' : ''}`).join('');

  sug.querySelectorAll('.sg-row').forEach(r => {
    r.addEventListener('mousedown', e => {
      e.preventDefault();
      input.value = r.dataset.url;
      sug.classList.remove('open');
      // Navigate current tab
      window.location.href = r.dataset.url;
    });
    r.addEventListener('touchend', e => {
      e.preventDefault();
      input.value = r.dataset.url;
      sug.classList.remove('open');
      // Navigate current tab
      window.location.href = r.dataset.url;
    });
  });
  sug.classList.add('open');
});

input.addEventListener('blur',  () => setTimeout(() => sug.classList.remove('open'), 200));
input.addEventListener('keydown', e => { if (e.key === 'Escape') { sug.classList.remove('open'); input.blur(); } });
</script>
</body>
</html>
