<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Glass Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blob"></div>
    <main class="glass-card">
        <h1>Good Morning.</h1>
        <div class="search-box">
            <form action="https://www.google.com/search" method="get">
                <input type="text" name="q" placeholder="Search the web..." autocomplete="off">
            </form>
        </div>
        <div class="shortcuts">
            <a href="https://youtube.com" class="chip">YouTube</a>
            <a href="https://github.com" class="chip">GitHub</a>
            <a href="https://reddit.com" class="chip">Reddit</a>
        </div>
    </main>
</body>
</html>
