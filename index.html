<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="description" content="NEXUS — New Tab"/>
<meta name="theme-color" content="#04040e"/>
<title>NEXUS · New Tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;-webkit-font-smoothing:antialiased}

:root{
  --bg:       #04040e;
  --surface:  rgba(255,255,255,0.04);
  --border:   rgba(0,220,255,0.13);
  --border-hi:rgba(0,220,255,0.35);
  --cyan:     #00dcff;
  --cyan-dim: rgba(0,220,255,0.45);
  --purple:   #a855f7;
  --text:     #c8dce8;
  --text-dim: rgba(200,220,232,0.4);
  --text-hi:  #eaf4ff;
  --glow:     0 0 14px rgba(0,220,255,0.22);
  --glow-sm:  0 0 7px rgba(0,220,255,0.16);
  --fui:      'Inter', sans-serif;
  --fhud:     'Orbitron', sans-serif;
}

body{
  background:var(--bg);
  font-family:var(--fui);
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100dvh;
}

/* ── BACKGROUND ── */
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.55}
.scan{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(0deg,
    transparent,transparent 3px,
    rgba(0,220,255,0.01) 3px,rgba(0,220,255,0.01) 4px);
}
.vig{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(4,4,14,0.72) 100%);
}

/* ── MAIN CONTAINER ── */
#wrap{
  position:relative;z-index:10;
  display:flex;flex-direction:column;align-items:center;
  gap:clamp(24px,4vh,40px);
  padding:clamp(20px,5vw,48px) clamp(16px,4vw,32px);
  width:100%;max-width:680px;
}

/* ── CLOCK ── */
#clk{
  font-family:var(--fhud);
  font-size:clamp(48px,14vw,112px);
  font-weight:700;letter-spacing:0.05em;
  color:var(--text-hi);line-height:1;text-align:center;
  text-shadow:0 0 28px rgba(0,220,255,0.32),0 0 70px rgba(0,220,255,0.1);
  animation:clkGlow 4s ease-in-out infinite alternate;
  user-select:none;
}
@keyframes clkGlow{
  from{text-shadow:0 0 24px rgba(0,220,255,0.28),0 0 60px rgba(0,220,255,0.08)}
  to  {text-shadow:0 0 38px rgba(0,220,255,0.5),0 0 90px rgba(0,220,255,0.16)}
}
#clk-date{
  font-family:var(--fhud);font-size:clamp(9px,1.6vw,11px);
  font-weight:500;letter-spacing:0.22em;color:var(--text-dim);
  text-align:center;text-transform:uppercase;margin-top:-clamp(14px,2.5vh,22px);
  user-select:none;
}

/* ── SEARCH ── */
#srch-wrap{
  width:100%;max-width:clamp(300px,72vw,540px);
  display:flex;flex-direction:column;gap:6px;position:relative;
}
#srch{
  display:flex;align-items:center;
  height:clamp(44px,7vw,56px);border-radius:999px;
  border:1px solid var(--border);background:var(--surface);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  padding:0 clamp(14px,2.5vw,22px);gap:10px;
  transition:border-color 0.2s,box-shadow 0.2s;
  position:relative;overflow:hidden;
}
#srch::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.05),transparent);
  pointer-events:none;
}
#srch:focus-within{
  border-color:rgba(168,85,247,0.45);
  box-shadow:0 0 16px rgba(168,85,247,0.16),inset 0 0 20px rgba(168,85,247,0.03);
}
.s-ico{color:var(--text-dim);font-size:clamp(15px,2.5vw,18px);flex-shrink:0}
#s-inp{
  flex:1;background:transparent;border:none;outline:none;
  font-family:var(--fui);font-size:clamp(13px,2.2vw,15px);
  font-weight:400;color:var(--text-hi);caret-color:var(--purple);min-width:0;
}
#s-inp::placeholder{color:var(--text-dim)}
#s-inp::selection{background:rgba(168,85,247,0.22)}
.s-shortcut{
  font-family:var(--fhud);font-size:clamp(6px,1vw,8px);
  letter-spacing:0.12em;color:var(--text-dim);
  border:1px solid rgba(255,255,255,0.09);padding:2px 8px;
  border-radius:5px;background:rgba(255,255,255,0.03);
  flex-shrink:0;white-space:nowrap;
}
@media(max-width:400px){.s-shortcut{display:none}}

/* Suggestions dropdown */
#suggest{
  position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:rgba(5,5,18,0.97);border:1px solid var(--border-hi);
  border-radius:12px;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  z-index:100;overflow:hidden;
  box-shadow:0 16px 48px rgba(0,0,0,0.55),var(--glow);
  display:none;
}
#suggest.open{display:block}
.sg-row{
  display:flex;align-items:center;gap:10px;
  padding:clamp(8px,1.5vw,11px) clamp(14px,2.5vw,18px);
  cursor:pointer;transition:background 0.14s;
}
.sg-row:hover{background:rgba(0,220,255,0.06)}
.sg-ico{color:var(--text-dim);font-size:11px;flex-shrink:0;width:14px;text-align:center}
.sg-txt{font-size:clamp(11px,1.8vw,13px);color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg-txt em{color:var(--cyan);font-style:normal}
.sg-type{font-family:var(--fhud);font-size:clamp(6px,0.9vw,7px);letter-spacing:0.1em;color:var(--text-dim);flex-shrink:0}
.sg-sep{height:1px;background:rgba(0,220,255,0.07);margin:0 14px}

/* ── APPS ── */
#apps{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(clamp(64px,13vw,80px),1fr));
  gap:clamp(10px,2vw,16px);
  width:100%;max-width:clamp(300px,74vw,560px);
}
.app{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  cursor:pointer;transition:transform 0.2s cubic-bezier(0.34,1.4,0.64,1);
}
.app:hover{transform:translateY(-4px)}
.app:active{transform:scale(0.95)}
.app-box{
  width:clamp(46px,9vw,60px);height:clamp(46px,9vw,60px);
  border-radius:clamp(12px,2vw,16px);
  border:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(20px,4vw,26px);
  transition:border-color 0.2s,box-shadow 0.2s,background 0.2s;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  position:relative;overflow:hidden;
}
.app-box::before{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(135deg,rgba(255,255,255,0.05) 0%,transparent 55%);
  pointer-events:none;
}
.app:hover .app-box{
  border-color:var(--border-hi);
  box-shadow:var(--glow-sm);
  background:rgba(0,220,255,0.06);
}
.app-lbl{
  font-size:clamp(9px,1.4vw,11px);font-weight:500;
  letter-spacing:0.06em;color:var(--text-dim);
  text-align:center;white-space:nowrap;text-transform:uppercase;
  transition:color 0.2s;
}
.app:hover .app-lbl{color:var(--text)}

/* ── STATUS ── */
#status{
  display:flex;align-items:center;justify-content:center;
  gap:clamp(16px,3vw,28px);
  padding:clamp(6px,1.2vw,10px) clamp(16px,3vw,28px);
  border-radius:999px;border:1px solid var(--border);
  background:rgba(0,0,0,0.25);backdrop-filter:blur(16px);
}
.st{
  display:flex;align-items:center;gap:6px;
  font-family:var(--fhud);font-size:clamp(6.5px,1.1vw,8px);
  font-weight:500;letter-spacing:0.12em;color:var(--text-dim);
  white-space:nowrap;
}
.st-dot{
  width:5px;height:5px;border-radius:50%;flex-shrink:0;
  animation:blink 2.5s ease-in-out infinite;
}
.st-dot.c{background:var(--cyan);box-shadow:0 0 5px var(--cyan)}
.st-dot.p{background:var(--purple);box-shadow:0 0 5px var(--purple)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.18}}
@media(max-width:380px){.st:nth-child(n+3){display:none}}

/* ── RIPPLE ── */
.rip{
  position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(0,220,255,0.15) 0%,transparent 70%);
  transform:scale(0);animation:ripOut 0.55s ease-out forwards;z-index:5;
}
@keyframes ripOut{to{transform:scale(7);opacity:0}}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="scan"></div>
<div class="vig"></div>

<div id="wrap">

  <!-- CLOCK -->
  <div>
    <div id="clk">00:00:00</div>
    <div id="clk-date">—</div>
  </div>

  <!-- SEARCH -->
  <div id="srch-wrap">
    <div id="srch">
      <span class="s-ico">⌕</span>
      <input id="s-inp" type="text" placeholder="Search or type a URL" autocomplete="off" spellcheck="false"/>
      <span class="s-shortcut">ENTER</span>
    </div>
    <div id="suggest"></div>
  </div>

  <!-- APPS -->
  <div id="apps">
    <div class="app"><div class="app-box">📊</div><span class="app-lbl">Analytics</span></div>
    <div class="app"><div class="app-box">⚙️</div><span class="app-lbl">Console</span></div>
    <div class="app"><div class="app-box">📁</div><span class="app-lbl">Files</span></div>
    <div class="app"><div class="app-box">🔐</div><span class="app-lbl">Vault</span></div>
    <div class="app"><div class="app-box">🌐</div><span class="app-lbl">Network</span></div>
    <div class="app"><div class="app-box">📡</div><span class="app-lbl">Monitor</span></div>
    <div class="app"><div class="app-box">🗃️</div><span class="app-lbl">Database</span></div>
    <div class="app"><div class="app-box">📝</div><span class="app-lbl">Docs</span></div>
  </div>

  <!-- STATUS -->
  <div id="status">
    <div class="st"><div class="st-dot c"></div><span id="st-node">CONNECTED</span></div>
    <div class="st"><span id="st-lat">4ms</span></div>
    <div class="st"><div class="st-dot p"></div>AES-256</div>
  </div>

</div>

<script>
/* ── CANVAS ── */
const C=document.getElementById('bg-canvas'),X=C.getContext('2d');
let W,H;
function rsz(){W=C.width=window.innerWidth;H=C.height=window.innerHeight}
rsz();window.addEventListener('resize',rsz);

const N=Math.min(40,Math.floor(window.innerWidth/18));
const dots=Array.from({length:N},()=>({
  x:Math.random(),y:Math.random(),
  vx:(Math.random()-.5)*.00028,vy:(Math.random()-.5)*.00028,
  r:Math.random()*.7+.25,
  ph:Math.random()*Math.PI*2,ps:Math.random()*.004+.002
}));

(function frame(){
  X.clearRect(0,0,W,H);
  dots.forEach((d,i)=>{
    d.x+=d.vx;d.y+=d.vy;d.ph+=d.ps;
    if(d.x<0)d.x=1;if(d.x>1)d.x=0;
    if(d.y<0)d.y=1;if(d.y>1)d.y=0;
    const a=(Math.sin(d.ph)*.4+.5)*.5;
    X.beginPath();X.arc(d.x*W,d.y*H,d.r,0,6.28);
    X.fillStyle=`rgba(0,220,255,${a})`;X.fill();
    for(let j=i+1;j<dots.length;j++){
      const q=dots[j],dx=(d.x-q.x)*W,dy=(d.y-q.y)*H,dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<85){
        X.beginPath();X.moveTo(d.x*W,d.y*H);X.lineTo(q.x*W,q.y*H);
        X.strokeStyle=`rgba(0,220,255,${(1-dist/85)*.06})`;
        X.lineWidth=.5;X.stroke();
      }
    }
  });
  requestAnimationFrame(frame);
})();

/* ── CLOCK ── */
const DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MONTHS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function tick(){
  const n=new Date();
  document.getElementById('clk').textContent=
    [n.getHours(),n.getMinutes(),n.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');
  document.getElementById('clk-date').textContent=
    `${DAYS[n.getDay()]} · ${n.getDate()} ${MONTHS[n.getMonth()]} ${n.getFullYear()}`;
}
tick();setInterval(tick,1000);

/* ── STATUS ── */
function rh(l){let s='';for(let i=0;i<l;i++)s+=Math.floor(Math.random()*16).toString(16).toUpperCase();return'0x'+s;}
setInterval(()=>document.getElementById('st-node').textContent=rh(4),4200);
setInterval(()=>document.getElementById('st-lat').textContent=(Math.random()*7+2|0)+'ms',1800);

/* ── SEARCH SUGGESTIONS ── */
const PAGES=[
  'google.com','github.com','localhost:3000','dashboard.io',
  'console.dev','docs.dev','analytics.io','monitoring.io','mail.google.com','youtube.com'
];
const suggest=document.getElementById('suggest');
const sInp=document.getElementById('s-inp');

sInp.addEventListener('input',()=>{
  const q=sInp.value.trim().toLowerCase();
  if(!q){suggest.classList.remove('open');return;}
  const hits=PAGES.filter(p=>p.includes(q)).slice(0,5);
  if(!hits.length){suggest.classList.remove('open');return;}
  suggest.innerHTML=hits.map((p,i)=>`
    <div class="sg-row" data-url="${p}">
      <span class="sg-ico">🌐</span>
      <span class="sg-txt">${p.replace(new RegExp(q,'gi'),m=>`<em>${m}</em>`)}</span>
      <span class="sg-type">WEB</span>
    </div>${i<hits.length-1?'<div class="sg-sep"></div>':''}`).join('');
  suggest.querySelectorAll('.sg-row').forEach(r=>{
    r.addEventListener('click',()=>{sInp.value=r.dataset.url;suggest.classList.remove('open');});
  });
  suggest.classList.add('open');
});
sInp.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Enter')suggest.classList.remove('open');});
sInp.addEventListener('blur',()=>setTimeout(()=>suggest.classList.remove('open'),180));

/* ── APPS ── */
document.querySelectorAll('.app').forEach(a=>{
  a.addEventListener('click',()=>{
    const b=a.querySelector('.app-box');
    b.style.transition='transform .15s,box-shadow .15s';
    b.style.transform='scale(1.15)';
    b.style.boxShadow='0 0 20px rgba(0,220,255,0.25)';
    setTimeout(()=>{b.style.transform='';b.style.boxShadow='';},160);
  });
});

/* ── RIPPLE on click ── */
document.getElementById('wrap').addEventListener('pointerdown',e=>{
  const r=document.createElement('div');r.className='rip';
  const rc=e.currentTarget.getBoundingClientRect(),s=80;
  r.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-rc.left-s/2}px;top:${e.clientY-rc.top-s/2}px`;
  e.currentTarget.appendChild(r);setTimeout(()=>r.remove(),560);
});
</script>
</body>
</html>
