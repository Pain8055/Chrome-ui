<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <title>Nova HUD (Mobile Ready)</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=JetBrains+Mono:wght@500&amp;family=Geist:wght@400&amp;family=Orbitron:wght@700&amp;display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tertiary-container": "#ecb6ff", "surface": "#13131a",
                        "on-background": "#e4e1ec", "background": "#13131a",
                        "on-secondary-container": "#007149", "primary-fixed": "#aaedff",
                        "on-surface-variant": "#bac9ce", "secondary-fixed": "#4dffb1",
                        "primary-container": "#00dcff", "secondary-container": "#00ffaa",
                        "error": "#ffb4ab", "primary-fixed-dim": "#00d9fc",
                        "secondary-fixed-dim": "#00e296", "on-surface": "#e4e1ec", "outline": "#859397"
                    },
                    fontFamily: {
                        "body-lg": ["Geist"], "label-mono": ["JetBrains Mono"], "headline-md": ["Space Grotesk"]
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #020206; margin: 0; overflow-x: hidden; overflow-y: auto; display: flex; align-items: flex-start; justify-content: center; min-height: 100dvh; color: #e4e1ec; -webkit-font-smoothing: antialiased; }
        @media (min-width: 1024px) { body { align-items: center; overflow-y: hidden; } }
        .vignette { position: fixed; inset: 0; background: radial-gradient(circle at center, transparent 30%, rgba(2, 2, 6, 0.9) 100%); pointer-events: none; z-index: 10; }
        .glass-panel { background: rgba(19, 19, 26, 0.3); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 8px 32px rgba(0, 0, 0, 0.5); }
        .glow-text-cyan { text-shadow: 0 0 10px rgba(0, 220, 255, 0.5), 0 0 40px rgba(0, 220, 255, 0.2); }
        @keyframes breathe { 0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 15px rgba(0, 220, 255, 0.4)); } 50% { opacity: 1; filter: drop-shadow(0 0 25px rgba(0, 220, 255, 0.8)); } }
        .animate-breathe { animation: breathe 4s ease-in-out infinite; }
        .progress-track { background: rgba(255, 255, 255, 0.05); height: 6px; border-radius: 3px; overflow: hidden; position: relative; }
        .progress-fill { height: 100%; width: 0%; transition: width 0.5s ease-out; position: relative; }
        .progress-fill::after { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 4px; background: #fff; box-shadow: 0 0 10px #fff; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .hex-clip { clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); }
        .hex-dock { width: clamp(85px, 20vw, 100px); height: clamp(98px, 23vw, 115px); position: relative; display: flex; align-items: center; justify-content: center; transition: all 0.3s; transform-style: preserve-3d; cursor: pointer; text-decoration: none;}
        .hex-dock::before { content: ''; position: absolute; inset: 1px; background: rgba(19, 19, 26, 0.6); clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); z-index: -1; transition: background 0.3s; }
        .hex-dock:hover { transform: scale(1.05) rotateX(10deg) rotateY(10deg); }
        .hex-dock:hover::before { background: rgba(0, 220, 255, 0.1); box-shadow: inset 0 0 20px rgba(0, 220, 255, 0.3); }
        .hex-dock:active { transform: scale(0.95); }
        .hex-label { opacity: 0; transform: translateY(10px); transition: all 0.3s; position: absolute; bottom: -25px; text-align: center; width: 100%; pointer-events: none; }
        .hex-dock:hover .hex-label { opacity: 1; transform: translateY(0); }
        .search-container:focus-within .glass-panel { border-color: rgba(0, 220, 255, 0.4); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 20px rgba(0, 220, 255, 0.2); }
        .sparkline { height: 20px; width: 100%; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 4px); position: relative; }
        .sparkline-fill { height: 100%; transition: width 0.5s; border-right: 2px solid; }
    </style>
</head>
<body class="text-on-surface font-body-md bg-background">

    <canvas id="particle-canvas"></canvas>
    <div class="vignette"></div>

    <div class="z-20 relative w-full max-w-[1600px] mx-auto p-5 sm:p-8 lg:p-10 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-[280px_1fr_280px] xl:grid-cols-[300px_1fr_300px] gap-6 sm:gap-8 lg:gap-10 items-center py-10 lg:py-0 min-h-[100dvh]">
        
        <main class="flex flex-col items-center justify-center gap-8 lg:gap-12 w-full max-w-2xl mx-auto order-1 lg:order-2 col-span-1 md:col-span-2 lg:col-span-1">
            <div class="text-center flex flex-col items-center gap-2 sm:gap-4 w-full">
                <div class="font-orbitron text-6xl sm:text-7xl md:text-8xl lg:text-9xl text-primary-container animate-breathe glow-text-cyan tracking-wider" id="clock">--:--:--</div>
                <div class="flex flex-col items-center gap-2 w-full max-w-md mt-2">
                    <div class="font-label-mono text-label-mono text-xs sm:text-sm uppercase text-secondary-fixed tracking-[0.2em] sm:tracking-[0.3em]" id="date">LOADING...</div>
                    <div class="w-full flex items-center gap-3 sm:gap-4 mt-2 px-4 sm:px-0">
                        <span class="font-label-mono text-[10px] text-on-surface-variant">DAY</span>
                        <div class="progress-track flex-1">
                            <div class="progress-fill" id="day-progress" style="background: linear-gradient(90deg, #00dcff, #00ffaa); width: 0%;"></div>
                        </div>
                        <span class="font-label-mono text-[10px] text-secondary-container" id="day-percent">0%</span>
                    </div>
                </div>
            </div>

            <div class="w-full search-container relative mt-2 sm:mt-0 px-2 sm:px-0">
                <div class="glass-panel rounded-full flex items-center px-4 sm:px-6 py-3 sm:py-4 transition-all duration-300 relative z-30">
                    <span class="material-symbols-outlined text-primary-fixed-dim mr-3 sm:mr-4" id="search-icon">search</span>
                    <input autocomplete="off" class="bg-transparent border-none outline-none text-on-surface text-sm sm:text-base font-body-lg w-full placeholder:text-on-surface-variant/50 focus:ring-0" id="omni-input" placeholder="Initiate query or input domain..." type="text"/>
                </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 gap-x-6 sm:gap-x-12 gap-y-10 sm:gap-y-12 mt-4 sm:mt-6 justify-items-center w-full">
                <a href="https://github.com" class="hex-dock hex-clip glass-panel group">
                    <span class="material-symbols-outlined text-4xl text-on-surface group-hover:text-primary-container transition-colors">code</span>
                    <div class="hex-label font-label-mono text-[10px] sm:text-label-mono text-primary-container">GITHUB</div>
                </a>
                <a href="https://youtube.com" class="hex-dock hex-clip glass-panel group">
                    <span class="material-symbols-outlined text-4xl text-on-surface group-hover:text-error transition-colors">play_circle</span>
                    <div class="hex-label font-label-mono text-[10px] sm:text-label-mono text-error">YOUTUBE</div>
                </a>
                <a href="https://reddit.com" class="hex-dock hex-clip glass-panel group">
                    <span class="material-symbols-outlined text-4xl text-on-surface group-hover:text-[#ff4500] transition-colors">forum</span>
                    <div class="hex-label font-label-mono text-[10px] sm:text-label-mono text-[#ff4500]">REDDIT</div>
                </a>
            </div>
        </main>

        <aside class="glass-panel rounded-xl p-5 sm:p-6 lg:p-8 flex flex-col gap-6 w-full max-w-md mx-auto order-2 lg:order-1 col-span-1">
            <div class="flex items-center gap-3 border-b border-white/5 pb-4">
                <span class="material-symbols-outlined text-primary-fixed-dim">thermostat</span>
                <h2 class="font-label-mono text-xs sm:text-label-mono uppercase tracking-widest text-primary-fixed-dim">Environment</h2>
            </div>
            <div class="flex flex-col gap-4">
                <div class="flex justify-between items-end">
                    <div class="font-headline-md text-2xl sm:text-3xl text-on-surface" id="temp">--°C</div>
                    <div class="font-label-mono text-xs sm:text-label-mono text-secondary-container" id="day-night">--</div>
                </div>
                <div class="space-y-3">
                    <div class="flex justify-between font-label-mono text-[10px] sm:text-label-mono text-on-surface-variant">
                        <span>HUMIDITY</span><span id="humidity-txt">--%</span>
                    </div>
                    <div class="progress-track"><div class="progress-fill" id="humidity-bar" style="background: linear-gradient(90deg, #00dcff, #00e296); width: 0%;"></div></div>
                </div>
            </div>
        </aside>

        <aside class="glass-panel rounded-xl p-5 sm:p-6 lg:p-8 flex flex-col gap-6 w-full max-w-md mx-auto order-3 lg:order-3 col-span-1">
            <div class="flex items-center gap-3 border-b border-white/5 pb-4">
                <span class="material-symbols-outlined text-secondary-container">memory</span>
                <h2 class="font-label-mono text-xs sm:text-label-mono uppercase tracking-widest text-secondary-container">Telemetry</h2>
            </div>
            <div class="flex flex-col gap-6">
                <div class="space-y-2">
                    <div class="flex justify-between font-label-mono text-[10px] sm:text-label-mono text-on-surface">
                        <span>CPU_CORE</span><span class="text-primary-container" id="cpu-txt">--%</span>
                    </div>
                    <div class="sparkline"><div class="sparkline-fill" id="cpu-bar" style="background: linear-gradient(90deg, transparent, rgba(0, 220, 255, 0.3)); border-color: #00dcff; width: 0%;"></div></div>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between font-label-mono text-[10px] sm:text-label-mono text-on-surface">
                        <span>MEM_ALLOC</span><span class="text-error" id="ram-txt">--%</span>
                    </div>
                    <div class="sparkline">
                        <div class="sparkline-fill" id="ram-bar" style="background: linear-gradient(90deg, transparent, rgba(255, 180, 171, 0.3)); border-color: #ffb4ab; width: 0%;"></div>
                    </div>
                </div>
                <div class="space-y-2">
                    <div class="flex justify-between font-label-mono text-[10px] sm:text-label-mono text-on-surface">
                        <span>NET_RECV</span><span class="text-secondary-fixed-dim" id="net-txt">-- Mbps</span>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script>
        // ─── SEARCH & URL LOGIC ───
        const searchInput = document.getElementById('omni-input');
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = searchInput.value.trim();
                if (!val) return;
                const isUrl = /^(https?:\/\/)?([\da-z\.-]+)\.([a-z\.]{2,6})([\/\w \.-]*)*\/?$/.test(val);
                if (isUrl) {
                    window.location.href = val.startsWith('http') ? val : 'https://' + val;
                } else {
                    window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(val);
                }
            }
        });

        // ─── CLOCK & DATE LOGIC ───
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB', { hour12: false });
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }).toUpperCase();
            
            const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const progress = ((now - startOfDay) / (24 * 60 * 60 * 1000)) * 100;
            document.getElementById('day-progress').style.width = `${progress}%`;
            document.getElementById('day-percent').textContent = `${Math.floor(progress)}%`;
        }
        setInterval(updateClock, 1000); updateClock();

        // ─── DIRECT WEATHER FETCH (No Backend Required) ───
        async function fetchWeather() {
            try {
                // Pre-configured for Hisar coordinates
                const url = 'https://api.open-meteo.com/v1/forecast?latitude=29.15&longitude=75.72&current_weather=true&hourly=relativehumidity_2m&timezone=auto';
                const res = await fetch(url);
                const data = await res.json();
                
                document.getElementById('temp').textContent = `${Math.round(data.current_weather.temperature)}°C`;
                document.getElementById('humidity-txt').textContent = `${data.hourly.relativehumidity_2m[0]}%`;
                document.getElementById('humidity-bar').style.width = `${data.hourly.relativehumidity_2m[0]}%`;
                document.getElementById('day-night').textContent = data.current_weather.is_day ? 'DAY CYCLE' : 'NIGHT CYCLE';
            } catch (err) { console.error('Weather err:', err); }
        }
        fetchWeather();
        setInterval(fetchWeather, 600000); // Update every 10 mins

        // ─── SIMULATED TELEMETRY FOR MOBILE ───
        // Phones block real CPU/RAM reading, so we simulate realistic fluctuations to keep the HUD alive
        let baseCpu = 15;
        let baseRam = 65;
        function updateSimulatedTelemetry() {
            // Fluctuate CPU by +/- 15%, Ram by +/- 2%
            let currentCpu = Math.max(2, Math.min(100, baseCpu + (Math.random() * 30 - 15)));
            let currentRam = Math.max(20, Math.min(95, baseRam + (Math.random() * 4 - 2)));
            let currentNet = (Math.random() * 8 + 0.5).toFixed(1);

            document.getElementById('cpu-txt').textContent = `${Math.round(currentCpu)}%`;
            document.getElementById('cpu-bar').style.width = `${Math.round(currentCpu)}%`;
            
            document.getElementById('ram-txt').textContent = `${Math.round(currentRam)}%`;
            document.getElementById('ram-bar').style.width = `${Math.round(currentRam)}%`;
            
            document.getElementById('net-txt').textContent = `${currentNet} Mbps`;
            
            // Periodically shift the "base" load slightly
            if(Math.random() > 0.8) baseCpu = Math.random() * 40 + 10;
        }
        updateSimulatedTelemetry();
        setInterval(updateSimulatedTelemetry, 2500); // Shift every 2.5 seconds

        // ─── PARTICLE BACKGROUND ───
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = Math.max(window.innerHeight, document.body.scrollHeight); }
        class Particle {
            constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.vx = (Math.random() - 0.5) * 0.5; this.vy = (Math.random() - 0.5) * 0.5; this.size = Math.random() * 2; }
            update() { this.x += this.vx; this.y += this.vy; if (this.x < 0 || this.x > width) this.vx *= -1; if (this.y < 0 || this.y > height) this.vy *= -1; }
            draw() { ctx.fillStyle = 'rgba(0, 220, 255, 0.3)'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
        }
        function initParticles() { particles = []; const count = window.innerWidth < 768 ? 40 : 100; for (let i = 0; i < count; i++) particles.push(new Particle()); }
        function animate() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update(); particles[i].draw();
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 100) { ctx.beginPath(); ctx.strokeStyle = `rgba(0, 220, 255, ${0.1 * (1 - dist/100)})`; ctx.lineWidth = 0.5; ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); }
                }
            }
            requestAnimationFrame(animate);
        }
        window.addEventListener('resize', () => { resize(); initParticles(); });
        resize(); initParticles(); animate();
    </script>
</body>
</html>
