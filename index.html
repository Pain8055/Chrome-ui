<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Nexus | Chrome UI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="particles"></canvas>
    <div class="background-glow"></div>

    <main class="glass-card">
        <div class="live-clock" id="clock">00:00:00</div>

        <h1 class="title">
            <span id="typing"></span>
        </h1>

        <p class="subtitle">Next-Gen Interface for Android</p>

        <div class="search-container">
            <form action="https://www.google.com/search" method="get" class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" name="q" placeholder="Search Google..." autocomplete="off">
            </form>
        </div>

        <div class="shortcuts">
            <a href="https://github.com" class="chip">GitHub</a>
            <a href="https://youtube.com" class="chip">YouTube</a>
            <a href="https://reddit.com" class="chip">Reddit</a>
        </div>

        <button class="start-btn" id="pulseBtn">INITIALIZE SYSTEM</button>
    </main>

    <script src="script.js"></script>
</body>
        </html>
